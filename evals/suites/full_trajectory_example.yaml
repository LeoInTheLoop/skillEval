suite_id: full_trajectory_example
suite_version: "1.0"
description: Full eval with generic trajectory judge and deterministic outcome checks

dataset: evals/datasets/trajectory_deliverable-pack_v1.0.jsonl

runtime: openclaw
runtime_options:
  bin: openclaw
  profile: skilleval
  # 容器 profile 每次都是全新的，不显式指定就会落到镜像默认模型上；
  # 写在这里它才进 config_hash（§4.4）。
  model: deepseek/deepseek-v4-flash
  # 镜像里 qwen 和 deepseek 两家 provider 都装着；用哪家由这一行决定。
  # 它决定 onboard 去读容器里的哪个 key 变量（deepseek → DEEPSEEK_API_KEY）。
  auth_choice: deepseek-api-key

environment:
  backend: docker
  image_env: SKILLEVAL_OPENCLAW_IMAGE
  network: full
  cpus: 2
  memory: 2g
  # 容器里的名字=宿主机 .env 里的名字。deepseek provider 认 DEEPSEEK_API_KEY。
  env_passthrough: [DEEPSEEK_API_KEY=DEEPSEEK_API_KEY]

skills:
  dir: subjects
  target: [deliverable-pack]
  include: [deliverable-pack]
  mode: full
  cfg: v1

models:
  - id: openclaw-default

tools: ["*"]
repeats: 2
parallelism: 1
timeout_seconds: 600

scoring:
  evaluators: [outcome, trajectory, reliability, efficiency]
  metrics: [task_completion, artifact_hit, tool_hit, tool_selection, state_persistence]
  gate:
    task_completion: ">= 0.80"
    artifact_hit: ">= 0.80"
    tool_selection: ">= 0.80"
  trajectory:
    enabled: true
    mode: judge
    judge_id: glm5
    dimensions: [tool_selection, argument_correctness, order_correctness, state_persistence, verification_rate]
  judge:
    id: glm5
    model: openai/glm-5.1
    api_base_env: JUDGE_BASE_URL
    api_key_env: JUDGE_API_KEY
    params:
      temperature: 0
    dimensions: [faithfulness, completeness, relevancy]
