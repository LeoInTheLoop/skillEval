# Docker-first full-eval example. Build environments/openclaw.Dockerfile, export
# its fixed image ID as SKILLEVAL_OPENCLAW_IMAGE, then use pipeline plan/run.
suite_id: example_full
suite_version: "1.0"
description: Docker-isolated deliverable-pack two-case full-eval smoke test

dataset: evals/datasets/full_example_v1.0.jsonl
dataset_kind: capability

runtime: openclaw
runtime_options:
  bin: openclaw
  profile: skilleval

environment:
  backend: docker
  image_env: SKILLEVAL_OPENCLAW_IMAGE
  network: full
  cpus: 2
  memory: 2g
  env_passthrough: [QWEN_API_KEY=DASHSCOPE_API_KEY]

skills:
  dir: subjects
  target: [deliverable-pack]
  include: [deliverable-pack]
  mode: full
  cfg: v1

models:
  - id: openclaw-default

# The container is the security boundary; expose the complete OpenClaw toolset.
tools: ["*"]
repeats: 1
parallelism: 1
timeout_seconds: 600

scoring:
  metrics: [task_completion, artifact_hit, tool_hit]
  gate:
    task_completion: ">= 1.0"
    artifact_hit: ">= 1.0"
    tool_hit: ">= 1.0"
